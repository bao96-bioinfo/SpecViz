name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and integration checks
        run: python -m unittest discover -s tests -v
      - name: Bundled helper
        run: python skills/specviz/scripts/specviz_cli.py --help
      - name: Distribution
        run: >-
          python -c "import json, subprocess, sys;
          channel=json.load(open('skills/specviz/release.json'))['channel'];
          subprocess.check_call([sys.executable, 'tools/package.py', '--channel', channel,
          '--output', '${{ runner.temp }}/specviz.zip'])"
